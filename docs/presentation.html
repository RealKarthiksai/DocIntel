          <p class="text-sm font-medium text-indigo-300 italic mb-6">${data.subtitle}</p>
          <div class="h-px w-full bg-slate-800 mb-6"></div>
          <ul class="space-y-3.5 text-slate-300 text-sm lg:text-base leading-relaxed">

          <span>Enterprise Document Intelligence Platform</span>
          <span>Review 4 Final Defense</span>
        </div>
      `;

    function nextSlide() {
      if (currentSlide < slidesData.length - 1) {
        currentSlide++;
        renderSlide(currentSlide);
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderSlide(currentSlide);
      }
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else if (document.exitFullscreen) {
        document.exitFullscreen();
      }
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") nextSlide();
      if (e.key === "ArrowLeft" || e.key === "PageUp") prevSlide();
      if (e.key === "f" || e.key === "F") toggleFullScreen();
    });

    renderSlide(0);
